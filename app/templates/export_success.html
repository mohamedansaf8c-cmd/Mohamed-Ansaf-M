<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comic Exported</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff8e7; margin: 0; padding: 60px 15px; text-align: center; }
    .box { max-width: 460px; margin: auto; background: #fff; border: 3px solid #222; border-radius: 8px; padding: 30px; box-shadow: 6px 6px 0 #222; }
    .btn { display: inline-block; margin: 8px; padding: 12px 20px; background: #e63946; color: #fff; text-decoration: none; border: 2px solid #222; border-radius: 4px; font-weight: bold; }
    .btn.alt { background: #fff; color: #222; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Your comic is ready</h1>
    <p>Your PDF was saved as <b>{{ pdf_name }}</b>.</p>
    <a class="btn" href="/static/exports/{{ pdf_name }}" download>Download PDF</a>
    <a class="btn alt" href="/">Make another</a>
  </div>
</body>
</html>
