<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComicCraft</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fff8e7; margin: 0; padding: 30px 15px; }
    .box { max-width: 520px; margin: auto; background: #fff; border: 3px solid #222; border-radius: 8px; padding: 24px; box-shadow: 6px 6px 0 #222; }
    h1 { margin-top: 0; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 9px; margin-top: 5px; border: 2px solid #222; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #e63946; color: #fff; border: 2px solid #222; border-radius: 4px; font-size: 17px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #888; }
    #wait { display: none; margin-top: 12px; color: #444; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ComicCraft</h1>
    <form action="/generate" method="post" onsubmit="document.getElementById('go').disabled=true; document.getElementById('wait').style.display='block';">
      <label>Story prompt</label>
      <textarea name="prompt" rows="3" placeholder="A brave fox exploring an enchanted forest" required></textarea>

      <label>Main character name</label>
      <input name="character" placeholder="Rusty" required>

      <label>Setting</label>
      <input name="setting" placeholder="Enchanted forest" required>

      <label>Tone</label>
      <select name="tone">
        <option>dramatic</option><option>funny</option><option>adventurous</option><option>mysterious</option><option>heartwarming</option>
      </select>

      <label>Art style</label>
      <select name="art_style">
        <option>comic book</option><option>anime</option><option>cartoon</option><option>realistic</option><option>watercolor</option>
      </select>

      <button id="go" type="submit">Create comic</button>
      <p id="wait">Creating your comic. This can take a few minutes, please keep this page open.</p>
    </form>
  </div>
</body>
</html>
